# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: lucaengelhard/daniel-huss

media_folder: /public/media
public_folder: /media

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/pages/home.md
        fields:
          - { label: Hero Image, name: hero, widget: image, min: 1, max: 1 }
  - name: works
    label: Works
    label_singular: Work
    folder: /content/works
    format: json
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Titelbild, name: header, widget: image }
      - { label: Info, name: info, widget: string }
      - { label: Content, name: content, widget: richtext, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - label: Details
        name: details
        widget: list
        required: false
        types:
          - label: Bild
            name: image_item
            fields:
              - label: Bild
                name: image
                widget: image
          - label: Video
            name: video_item
            fields:
              - label: Video
                name: video
                widget: file
                accept: video/*
          - label: Dreispalter
            name: three_col
            fields:
              - label: Text Links
                name: text_left
                widget: string
              - label: Text Mitte
                name: text_middle
                widget: string
              - label: image
                name: image
                widget: image
      - label: Referenzen
        name: references
        widget: image
        required: false
  - name: links
    label: Links
    label_singular: Link
    folder: /content/links
    format: json
    fields:
      - label: Link
        name: link
        widget: string
      - label: Bild
        name: image
        widget: image
        max: 1
        min: 1
