# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: lucaengelhard/daniel-huss

media_folder: /public/media
public_folder: /media

collections:
  - name: works
    label: Work
    label_singular: Works
    folder: /content/works
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Titelbild, name: header, widget: image }
      - { label: Info, name: info, widget: string }
      - { label: Content, name: content, widget: richtext, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - label: Details
        name: details
        widget: list
        required: false
        types:
          - label: Bild
            name: image_item
            fields:
              - label: Bild
                name: image
                widget: image
          - label: Video
            name: video_item
            fields:
              - label: Video
                name: video
                widget: file
                accept: video/*
          - label: Dreispalter
            name: three_col
            fields:
              - label: Text Links
                name: text_left
                widget: string
              - label: Text Mitte
                name: text_middle
                widget: string
              - label: image
                name: image
                widget: image
      - label: Referenzen
        name: references
        widget: image
        required: false
