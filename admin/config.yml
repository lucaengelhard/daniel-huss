# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: lucaengelhard/daniel-huss
  auth_methods:
    - token

media_folder: /public/media
public_folder: /media

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/pages/home.json
        format: json
        fields:
          - { label: Hero Image, name: hero, widget: image, min: 1, max: 1 }
      - name: about
        label: About
        file: content/pages/about.json
        format: json
        fields:
          - { label: Info, name: info, widget: text }
          - { label: Beschreibung, name: content, widget: richtext }
          - { label: Portrait, name: portrait, widget: image, min: 1, max: 1 }
      - name: contact
        label: Contact
        file: content/pages/contact.json
        format: json
        fields:
          - { label: Content, name: content, widget: richtext }
  - name: works
    label: Works
    label_singular: Work
    folder: /content/works
    format: json
    reorder: true
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Titelbild, name: header, widget: image }
      - { label: Info, name: info, widget: string }
      - { label: Content, name: content, widget: richtext, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - label: Details
        name: details
        widget: list
        required: false
        types:
          - label: Bild
            name: image_item
            fields:
              - label: Bild
                name: image
                widget: image
                multiple: true
          - label: Video
            name: video_item
            fields:
              - label: Video
                name: video
                widget: file
                accept: video/*
                multiple: true
          - label: Dreispalter
            name: three_col
            fields:
              - label: Text Links
                name: text_left
                widget: text
                required: false
              - label: Text Mitte
                name: text_middle
                widget: text
                required: false
              - label: image
                name: image
                widget: image
                required: false
      - label: Referenzen
        name: references
        widget: image
        multiple: true
        required: false
  - name: news
    label: News
    folder: content/news
    reorder: true
    format: json
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Untertitel, name: subtitle, widget: string, required: false }
      - { label: Datum, name: date, widget: string, required: false }
      - {
          label: Beschreibung,
          name: content,
          widget: richtext,
          required: false,
        }
      - {
          label: Bild,
          name: image,
          widget: image,
          min: 1,
          max: 1,
          required: false,
        }
      - {
          label: Video,
          name: video,
          widget: file,
          accept: video/*,
          min: 1,
          max: 1,
          required: false,
        }
  - name: links
    label: Footer
    label_singular: Footer Item
    folder: /content/links
    format: json
    fields:
      - label: Link
        name: link
        widget: string
      - label: Bild
        name: image
        widget: image
        max: 1
        min: 1
